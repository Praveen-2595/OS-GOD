    wallpaper: "2242388122"
    volume: 80
    apps:
      - opera gx
    websites:
      - https://www.google.com/search?q=IPL
      - https://www.hotstar.com
      - https://music.youtube.com/playlist?list=PLf6wwr2YCKEDmRZ4yOUTLOS8ju-byzRpQ
    close:
